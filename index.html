
<!DOCTYPE html>
<html lang="pt-br">

    <body>
    </header>
    <h1>Regras do Handball</h1>
    <p>Aqui vou compartilhar as regras do Handball</p>
    <header>
        <main>
            <img src="imagem-hand.png" alt="">
            <div>
            <h2>Regras e tudo sobre o Handball</h2>     
            <p>Por: Wesley Damacena</p>
            <p>Sejam Bem Vindos(as)! Aqui vou compartilhar regras de Handball e tudo sobre ele.</p>
            <button>🤾 <span>0</span></button>
            <button>👍<span>0</span></button>
            </div>
        
        
        
        </main>

    </body>
    <script>
        const botoes = document.querySelector("button");

        botoes.forEach(function (botao) {
            let curtiu = false;
            botao.addEventListener("click", botaoClicado);
            function botaoClicado() {
                console.log("fui clicado");
                let texto = botao.querySelector("span");
                if (curtiu === false){
                    texto.textContent++;
                    curtiu = true;
                } else{
                    texto.textContent--;
                    curtiu = false;
                }
            }
        })

    </script>
</html>
